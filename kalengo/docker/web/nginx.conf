# ============================================================
# Nginx untuk SPA KALENGO (§13.1 header keamanan, §15 cache immutable)
# Dipakai hanya oleh target `runtime` (produksi/staging).
# Dev memakai Vite dev server, bukan berkas ini.
#
# CSP nonce tidak bisa ditanam di nginx statis. Karena bundle Vite memakai
# <script src> eksternal (bukan skrip inline), `script-src 'self'` sudah cukup
# dan TIDAK memerlukan 'unsafe-inline'. Untuk style, React menulis atribut
# style="" di beberapa komponen animasi sehingga 'unsafe-inline' disisakan
# pada style-src saja, dengan catatan TODO(M6) untuk migrasi ke CSS classes.
# ============================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ---------- Header keamanan (§13.1) ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # HSTS aktifkan setelah HTTPS benar-benar berjalan (lihat §15).
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https:; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # ---------- Kompresi ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/xml image/svg+xml font/woff2;

    # ---------- Aset ber-hash: cache immutable (§15) ----------
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Font & gambar statis tanpa hash: TTL menengah
    location ~* \.(?:woff2?|ttf|otf|svg|png|jpe?g|webp|avif|ico)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Service worker & manifest tidak boleh di-cache lama
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # index.html selalu revalidasi
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ---------- Proxy API (same-origin, jadi CSP connect-src 'self' cukup) ----------
    location = /readyz {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE (§8.7): matikan buffering & long timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
    }

    # ---------- SPA fallback ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
