# ============================================================
# KALENGO — stack pengembangan lokal (§15)
#   postgres · redis · mailhog · minio · api · worker · web
#
#   docker compose up -d postgres redis mailhog minio   # infrastruktur saja
#   docker compose up api worker                        # backend (butuh toolchain Go di image)
#   docker compose up web                               # frontend Vite
#
# Password di bawah HANYA untuk pengembangan lokal (lihat .gitleaks.toml allowlist).
# ============================================================
name: kalengo

services:
  # ---------- PostgreSQL 16 (§11) ----------
  postgres:
    image: postgres:16-alpine
    container_name: kalengo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: postgres
      # dipakai oleh docker/postgres/initdb/01-roles.sql
      KALENGO_DB: kalengo
      KALENGO_APP_USER: kalengo_app
      KALENGO_APP_PASSWORD: app_dev_password
      KALENGO_MIGRATOR_USER: kalengo_migrator
      KALENGO_MIGRATOR_PASSWORD: migrator_dev_password
    ports:
      - "5432:5432"
    volumes:
      - kalengo-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      # §13.3 audit query: pg_stat_statements wajib aktif
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=500
      - -c
      - timezone=UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kalengo"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ---------- Redis (cache, rate limit, pub/sub, antrean Asynq) ----------
  redis:
    image: redis:7.4-alpine
    container_name: kalengo-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: redis_dev_password
    ports:
      - "6379:6379"
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --appendonly yes
        --appendfsync everysec
        --maxmemory 256mb
        --maxmemory-policy noeviction
    volumes:
      - kalengo-redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ---------- Email dev (nama service "mailhog" sesuai §15, image Mailpit) ----------
  # Mailpit = penerus MailHog yang masih dirawat. API SMTP & UI sama-sama kompatibel.
  mailhog:
    image: axllent/mailpit:v1.20
    container_name: kalengo-mailhog
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ---------- Object storage (S3 API) ----------
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: kalengo-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: kalengo
      MINIO_ROOT_PASSWORD: minio_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - kalengo-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest # TODO(M0): pin ke digest/tag saat rilis
    container_name: kalengo-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 kalengo minio_dev_password &&
      mc mb --ignore-existing local/kalengo-media &&
      mc anonymous set download local/kalengo-media/public &&
      echo '[minio-init] bucket kalengo-media siap';
      "
    restart: "no"

  # ---------- Go API (chi) ----------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: kalengo-api
    restart: unless-stopped
    working_dir: /src
    volumes:
      - ./apps/api:/src
      - kalengo-gomod:/go/pkg/mod
      - kalengo-gocache:/root/.cache/go-build
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      LOG_LEVEL: debug
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://kalengo_app:app_dev_password@postgres:5432/kalengo?sslmode=disable&application_name=kalengo-api
      REDIS_URL: redis://:redis_dev_password@redis:6379/0
      JWT_SECRET: dev_only_secret_change_me_min_32_bytes_long!!
      COOKIE_SECURE: "false"
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      S3_ENDPOINT: http://minio:9000
      GOFLAGS: -mod=mod
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Boot pertama menyelesaikan go.sum (lihat docs/M0-SETUP.md)
    command: sh -c "go mod tidy && go run ./cmd/api"

  # ---------- Asynq worker (email, expire pesanan, retry webhook) ----------
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: kalengo-worker
    restart: unless-stopped
    working_dir: /src
    volumes:
      - ./apps/api:/src
      - kalengo-gomod:/go/pkg/mod
      - kalengo-gocache:/root/.cache/go-build
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgres://kalengo_app:app_dev_password@postgres:5432/kalengo?sslmode=disable&application_name=kalengo-worker
      REDIS_URL: redis://:redis_dev_password@redis:6379/0
      JWT_SECRET: dev_only_secret_change_me_min_32_bytes_long!!
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      S3_ENDPOINT: http://minio:9000
      GOFLAGS: -mod=mod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "go mod tidy && go run ./cmd/worker"

  # ---------- React (Vite) ----------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    container_name: kalengo-web
    restart: unless-stopped
    working_dir: /src
    volumes:
      - ./apps/web:/src
      - kalengo-node_modules:/src/node_modules
    environment:
      # Kosong = same-origin: browser memanggil /api/v1/... di port 5173 dan
      # Vite mem-proxy ke service api. Ini membuat cookie sesi tetap same-origin.
      VITE_API_BASE_URL: ""
      VITE_PROXY_TARGET: http://api:8080
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    depends_on:
      - api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  kalengo-pgdata:
  kalengo-redisdata:
  kalengo-miniodata:
  kalengo-gomod:
  kalengo-gocache:
  kalengo-node_modules:
