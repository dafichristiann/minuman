# ============================================================
# sqlc — §10.2 "DB akses: pgx/v5 + sqlc (query bertipe, tanpa ORM ajaib)"
#
#   make sqlc      # regenerate internal/repo/sqlcgen
#   sqlc vet       # §13.3
#   sqlc compile   # §13.3
#
# Kode hasil generate DI-COMMIT (lihat .gitignore) supaya CI bisa
# `go build` tanpa memasang sqlc di runner.
# ============================================================
version: "2"

sql:
  - engine: postgresql
    # Hanya migrasi UP yang jadi sumber skema. Migrasi DOWN berisi DROP
    # dan tidak boleh masuk katalog sqlc.
    schema: db/migrations/*.up.sql
    queries: db/queries
    # strict_function_checks diaktifkan kembali pada M1 setelah `sqlc vet` hijau
    # pertama kali (fungsi kustom apa pun harus dikenali sqlc lebih dulu).
    strict_order_by: true
    gen:
      go:
        package: sqlcgen
        out: internal/repo/sqlcgen
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_prepared_queries: false
        emit_db_tags: false
        emit_json_tags: false
        emit_enum_valid_method: true
        emit_all_enum_values: true
        query_parameter_limit: 4
        overrides:
          # Uang & id besar tetap int64; tidak ada float untuk uang (§11.1)
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "citext"
            go_type: "string"
          - db_type: "inet"
            go_type: "netip.Addr"
          - db_type: "inet"
            nullable: true
            go_type:
              import: "net/netip"
              type: "Addr"
              pointer: true
