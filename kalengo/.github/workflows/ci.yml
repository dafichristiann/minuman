# ============================================================
# KALENGO — CI (§13.3, §17)
#
# Setiap push/PR menjalankan gerbang mutu yang sama dengan `make audit`:
#   - format & lint Go
#   - uji unit + race detector (dengan PostgreSQL & Redis sungguhan)
#   - migrasi up → down → up (idempoten)
#   - sqlc vet, gosec, govulncheck, gitleaks
#   - lint, typecheck, uji, dan build frontend
#
# CI GAGAL bila salah satu gerbang merah. Tidak ada pengecualian manual.
# ============================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Batalkan run lama pada ref yang sama agar tidak menumpuk antrean.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "22"

jobs:
  # ------------------------------------------------------------
  # 1. Rahasia & kerentanan dependensi (cepat, dijalankan lebih dulu)
  # ------------------------------------------------------------
  security:
    name: Rahasia & kerentanan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks perlu riwayat penuh untuk memindai commit lama.
          fetch-depth: 0

      - name: gitleaks (§13.3: 0 temuan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # go.sum sengaja belum di-commit pada M0 (lihat docs/M0-SETUP.md §2),
          # sehingga caching modul dimatikan agar job tidak gagal saat hash file
          # belum ada. Aktifkan kembali (`cache: true`) setelah go.sum di-commit.
          cache: false

      - name: Siapkan modul Go
        working-directory: apps/api
        run: |
          go mod tidy
          go mod download

      - name: govulncheck (§13.3)
        working-directory: apps/api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gosec (§13.3)
        working-directory: apps/api
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet -exclude-generated ./...

  # ------------------------------------------------------------
  # 2. Backend: format, lint, uji, migrasi
  # ------------------------------------------------------------
  api:
    name: Backend (Go)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kalengo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/kalengo_test?sslmode=disable
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kalengo_test?sslmode=disable
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Lihat catatan pada job `security`: caching dimatikan sampai go.sum ada.
          cache: false

      - name: go mod tidy
        working-directory: apps/api
        run: go mod tidy

      - name: Format (gofmt) — tidak boleh ada file yang belum diformat
        working-directory: apps/api
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::File Go berikut belum diformat (jalankan 'go fmt ./...'):"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint (§13.3)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1
          working-directory: apps/api
          args: --config ../../.golangci.yml --timeout 5m

      - name: Uji unit + race detector (§13.3)
        working-directory: apps/api
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Ringkasan cakupan
        working-directory: apps/api
        run: go tool cover -func=coverage.out | tail -n 20

      - name: Unggah artefak cakupan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.out
          if-no-files-found: ignore

      - name: sqlc vet (§13.3)
        working-directory: apps/api
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.27.0
          sqlc vet

      - name: Pasang golang-migrate
        run: |
          curl -fsSL https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz \
            | tar xz
          sudo mv migrate /usr/local/bin/migrate

      - name: Migrasi up → down → up (idempoten, §13.3)
        working-directory: apps/api
        run: |
          set -euo pipefail
          migrate -path db/migrations -database "$MIGRATE_DATABASE_URL" up
          migrate -path db/migrations -database "$MIGRATE_DATABASE_URL" down
          migrate -path db/migrations -database "$MIGRATE_DATABASE_URL" up

      - name: Seed data contoh harus jalan tanpa error
        working-directory: apps/api
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/dev_seed.sql

      - name: Kontrak OpenAPI harus valid
        working-directory: apps/api
        run: |
          npx --yes @redocly/cli@latest lint openapi.yaml

  # ------------------------------------------------------------
  # 3. Frontend: lint, typecheck, uji, build
  # ------------------------------------------------------------
  web:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Pastikan lockfile ada (prasyarat npm ci)
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::apps/web/package-lock.json belum ada. Jalankan 'npm install' di apps/web lalu commit lockfile."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Pasang dependensi
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Uji unit
        run: npm run test -- --run

      - name: Uji aksesibilitas (axe, §14)
        run: npm run test:a11y

      - name: Build produksi
        run: npm run build

      - name: Audit dependensi produksi
        run: npm audit --omit=dev --audit-level=high

      - name: Periksa anggaran ukuran bundel (§1.4)
        run: node scripts/check-budget.mjs

      - name: Unggah artefak build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: ignore
